<div class="container">
    <div class="custom-card-log p-0 my-3 col-sm-12 col-md-8 col-lg-6 mx-auto">
        <div class="custom-card-header-log text-white p-3">
            <div class="row">
                <button mat-button routerLink = "/landing"><mat-icon>arrow_back</mat-icon></button>
                <h5 class="mt-2"><strong>Invite Users</strong></h5>
            </div>
        </div>
        <mat-progress-bar *ngIf="loading" class='onboarding-loading-bar'  mode="indeterminate"></mat-progress-bar>
        <div class="custom-card-body p-3">
            <form class="card-body pt-0 pl-0 pr-0 m-0 login-form">
                <div class="row">
                    <div class="col-sm-12">
                        <div class="error-alert" [class.active]="hasErrors">{{errorMessage}}</div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12">
                        <p>You can invite other users into your company profile. Add users here, or press skip</p>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let user of users;">
                                    <td>{{user.name}} {{user.surname}}</td>
                                    <td>{{user.emailAddress}}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="row">
                    <!-- candidate name -->
                    <mat-form-field class="col-sm-12 col-md-6" appearance="fill">
                        <mat-label>Name</mat-label>
                        <input [formControl]="username" matInput placeholder="John" type="text">
                        <mat-error *ngIf="username.invalid">This field is required</mat-error>
                    </mat-form-field>
                    <!-- email -->
                    <mat-form-field class="col-sm-12 col-md-6" appearance="fill">
                        <mat-label>Email</mat-label>
                        <input required pattern="^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" [formControl]="email" matInput placeholder="mail@example.com" type="email">
                        <mat-error *ngIf="email.invalid">Please input a valid email address</mat-error>
                    </mat-form-field>
                </div>
                <div class="row mb-2">
                    <div class="text-left col-sm-12">
                        <button (click)="invite()" mat-stroked-button [disabled]="loading" matTooltip="Invite Users">Invite User</button>
                    </div>
                </div>
                <div class="row">
                    <div class="text-right col-sm-12">
                        <button (click)="next()" mat-button [disabled]="loading" matTooltip="Next" class="primary-button"> Next <mat-icon>arrow_forward</mat-icon></button>
                    </div>
                </div>
            </form>
        </div>
    </div>
