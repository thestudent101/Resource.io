<mat-progress-bar *ngIf = "loading"  mode="indeterminate"></mat-progress-bar>
<!-- details -->
<div class="container pt-3">
    <div class="row pb-3">
        <div class="col-sm-12">
            <a mat-stroked-button routerLink="/main/dashboard"><mat-icon>arrow_back</mat-icon> Back </a>
        </div>
    </div>
    <!-- no companies -->
    <div class="alert alert-light mt-3" *ngIf="companies.length == 0 && !loading">
        Unfortunately there are no company profiles on the platform
    </div>

    <mat-card *ngIf="loading">
        <mat-card-content>
            <p class="text-center">Please Wait: Loading Companies</p>
        </mat-card-content>
    </mat-card>

    <div class="row mt-2">
        <div class="col-sm-12 col-md-6 col-lg-4 mx-left my-2" *ngFor="let company of companies">
        
            <!--
            <mat-card class="company-dashboard-card">
                <mat-card-header class="w-100">
                    <mat-card-title class="custom-mat-card-title w-100" *ngIf="isAuthenticated"><span class="text-subtle">Company Name:</span><br>{{company.name}}</mat-card-title>
                    <mat-card-title class="custom-mat-card-title w-100" *ngIf="!isAuthenticated"><span class="text-subtle">Company Name:</span><br>{{company.sanitizedName}}</mat-card-title>
                </mat-card-header>
                <mat-card-content>
                    <p class="text-center text-subtle mb-0">Job Profiles</p>
                    <p class="giant-number text-center">{{company.totalJobProfiles}}</p>
                    <mat-divider></mat-divider>
                </mat-card-content>
                <mat-card-actions>
                    <a mat-button [routerLink]="company.id+'/jobs'" [disabled]="company.totalJobProfiles == 0" [class.disabled]="company.totalJobProfiles == 0">View Available Jobs</a>
                </mat-card-actions>
            </mat-card>
            -->

            <!-- new company profile card -->
            <div class="custom-card my-3">
                <div class="custom-card-header p-3 text-white">
                    <p *ngIf="isAuthenticated"><span class="text-subtle">Company Name:</span><br>{{company.name}}</p>
                    <p *ngIf="!isAuthenticated"><span class="text-subtle">Company Name:</span><br>{{company.sanitizedName}}</p>
                </div>
                <div class="custom-card-body p-3">
                    <p class="text-center text-subtle mb-0">Job Profiles</p>
                    <p class="giant-number text-center">{{company.totalJobProfiles}}</p>
                </div>
                <mat-divider class="mb-3"></mat-divider>
                <div class="custom-card-actions px-3 pb-3">
                    <a mat-button [routerLink]="company.id+'/jobs'" [disabled]="company.totalJobProfiles == 0" [class.disabled]="company.totalJobProfiles == 0">View Available Jobs</a>
                </div>
            </div>
        </div>
    </div>
</div>
