<div class="forgot-password-container">
  <div class="forgot-password-card">
    <div class="logo-container">
      <img src="assets/ResourceIO-Logo.png" alt="Resource.io" class="logo">
    </div>

    <h2>Reset Your Password</h2>
    <p class="subtitle">Enter your email address and we'll send you instructions to reset your password.</p>

    <!-- Error Message -->
    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Success Message -->
    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="resetPassword()">
      <div class="form-group">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="your@email.com">
          <mat-error *ngIf="forgotPasswordForm.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="forgotPasswordForm.get('email')?.hasError('email')">Please enter a valid email</mat-error>
        </mat-form-field>
      </div>

      <button 
        mat-raised-button 
        color="primary" 
        class="submit-button" 
        type="submit" 
        [disabled]="loading">
        {{ loading ? 'Sending...' : 'Send Reset Instructions' }}
      </button>

      <div class="back-to-login">
        <a routerLink="/auth/login">Back to Login</a>
      </div>
    </form>
  </div>
</div>
