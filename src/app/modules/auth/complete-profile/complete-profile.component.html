<div class="complete-profile-container">
  <div class="complete-profile-card">
    <div class="logo-container">
      <img src="assets/ResourceIO-Logo.png" alt="Resource.io" class="logo">
    </div>

    <h2>Complete Your Profile</h2>
    <p class="subtitle">Please provide some additional information to complete your profile.</p>

    <!-- Error Message -->
    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="user-type-selector">
      <button 
        [class.active]="userType === 'client'" 
        (click)="setUserType('client')">
        <mat-icon>business</mat-icon>
        <span>I'm hiring talent</span>
      </button>
      <button 
        [class.active]="userType === 'contractor'" 
        (click)="setUserType('contractor')">
        <mat-icon>person</mat-icon>
        <span>I'm looking for work</span>
      </button>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
      <div class="form-row">
        <div class="form-group half-width">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>First Name</mat-label>
            <input matInput formControlName="firstName" placeholder="First Name">
            <mat-error *ngIf="profileForm.get('firstName')?.hasError('required')">First name is required</mat-error>
          </mat-form-field>
        </div>

        <div class="form-group half-width">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Last Name</mat-label>
            <input matInput formControlName="lastName" placeholder="Last Name">
            <mat-error *ngIf="profileForm.get('lastName')?.hasError('required')">Last name is required</mat-error>
          </mat-form-field>
        </div>
      </div>

      <div class="form-group">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Phone Number</mat-label>
          <input matInput formControlName="phone" placeholder="Phone Number">
          <mat-error *ngIf="profileForm.get('phone')?.hasError('pattern')">Please enter a valid phone number</mat-error>
        </mat-form-field>
      </div>

      <!-- Client-specific fields -->
      <div *ngIf="userType === 'client'">
        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Company Name</mat-label>
            <input matInput formControlName="company" placeholder="Company Name">
            <mat-error *ngIf="profileForm.get('company')?.hasError('required')">Company name is required</mat-error>
          </mat-form-field>
        </div>

        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Position</mat-label>
            <input matInput formControlName="position" placeholder="Position">
            <mat-error *ngIf="profileForm.get('position')?.hasError('required')">Position is required</mat-error>
          </mat-form-field>
        </div>
      </div>

      <button 
        mat-raised-button 
        color="primary" 
        class="submit-button" 
        type="submit" 
        [disabled]="loading">
        {{ loading ? 'Saving...' : 'Complete Profile' }}
      </button>
    </form>
  </div>
</div>
