<div class="mt-3">
    <mat-card>
        <mat-card-content>
            <div class="row">
                <div class="col-sm-12">
                    <h3>Contractor Timesheets</h3>
                </div>
            </div>
            <div class="row"><!--  -->
                <div class="col-12">
                    <mat-form-field class="col-md-3">
                        <mat-label>Contractors</mat-label>
                        <mat-select [(ngModel)]="contractId">
                            <mat-option *ngFor="let contract of contracts" [value]="contract.contractId">
                                {{contract.contractorName}}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                    <button (click)="loadTimesheets()" mat-stroked-button>Query Timesheets</button>
                </div>
            </div>
        </mat-card-content>
    </mat-card>
    <!-- timesheets -->

    <mat-card class="mt-3" *ngIf="hasTimesheets">
        <mat-card-content>
            <table class="table">
                <thead>
                    <tr>
                        <th>Activity</th>
                        <th>Date</th>
                        <th class="text-right">Duration</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let timesheet of timesheets">
                        <td><h5 class="mb-0">{{timesheet.activity}}</h5>{{timesheet.description}}</td>
                        <td><h6>{{timesheet.date}}</h6></td>
                        <td class="text-right"><h5 class="mb-0">{{timesheet.minutes | hoursMinutes}}</h5>{{timesheet.status}}</td>
                        <td class="text-right">
                            <button (click)="acceptTimesheet(timesheet)" mat-icon-button>
                                <mat-icon>done</mat-icon>
                            </button><br>
                            <button (click)="rejectTimesheet(timesheet)" mat-icon-button>
                                <mat-icon>clear</mat-icon>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </mat-card-content>
    </mat-card>
</div>
