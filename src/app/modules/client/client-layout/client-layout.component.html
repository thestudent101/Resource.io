<div class="client-layout">
  <!-- Sidebar -->
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav [opened]="sidenavOpen" [mode]="'side'" class="sidenav">
      <!-- Logo -->
      <div class="logo-container">
        <img src="assets/ResourceIO-Logo.png" alt="Resource.io" class="logo">
      </div>

      <!-- Navigation Links -->
      <mat-nav-list>
        <a mat-list-item routerLink="/client/dashboard" routerLinkActive="active">
          <mat-icon matListIcon>dashboard</mat-icon>
          <span matLine>Dashboard</span>
        </a>
        <a mat-list-item routerLink="/client/jobs" routerLinkActive="active">
          <mat-icon matListIcon>work</mat-icon>
          <span matLine>Job Postings</span>
        </a>
        <a mat-list-item routerLink="/client/candidates" routerLinkActive="active">
          <mat-icon matListIcon>people</mat-icon>
          <span matLine>Candidates</span>
        </a>
        <mat-divider></mat-divider>
        <a mat-list-item routerLink="/client/profile" routerLinkActive="active">
          <mat-icon matListIcon>person</mat-icon>
          <span matLine>Profile</span>
        </a>
        <a mat-list-item (click)="signOut()">
          <mat-icon matListIcon>exit_to_app</mat-icon>
          <span matLine>Sign Out</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="content-container">
      <!-- Top Bar -->
      <mat-toolbar color="primary" class="top-bar">
        <button mat-icon-button (click)="toggleSidenav()">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="spacer"></span>
        <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-button">
          <mat-icon>account_circle</mat-icon>
          <span>{{ userName || userEmail }}</span>
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item routerLink="/client/profile">
            <mat-icon>person</mat-icon>
            <span>Profile</span>
          </button>
          <button mat-menu-item (click)="signOut()">
            <mat-icon>exit_to_app</mat-icon>
            <span>Sign Out</span>
          </button>
        </mat-menu>
      </mat-toolbar>

      <!-- Main Content -->
      <div class="main-content">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
