<!-- progress bar -->
<br>
<mat-progress-bar *ngIf="!ready" mode="indeterminate"></mat-progress-bar>
<br>
<!-- body -->
<div class="container client-profile pt-3">
            <!-- subscription details -->
            <div class="col-sm-12 col-md-12">
                <mat-card class="h-100">
                    <mat-card-header>
                        <mat-card-title style="color:rgb(29, 28, 28)"><strong>Payment Result</strong></mat-card-title>
                    </mat-card-header>
                    <mat-progress-spinner *ngIf="!ready" mode="indeterminate"></mat-progress-spinner>
                    <mat-card-header *ngIf="ready">
                        <mat-card-title *ngIf="!error && success"  class="payment-success"><strong>Payment Successful</strong></mat-card-title>
                        <mat-card-title *ngIf="!error && !success" class="payment-failure"><strong>Payment Denied</strong></mat-card-title>
                        <mat-card-title *ngIf="error" class="payment-failure"><strong>Request Error</strong></mat-card-title>
                      </mat-card-header>
                    <mat-card-content *ngIf="ready" class="container">
                        <div class="row">
                            <div class="col-sm-12">
                                <div class="clientDetails">
                                    <p>{{paymentResult}}</p>
                                </div>
                            </div>
                        </div>
                    </mat-card-content>
                </mat-card>
            </div>
            <br> <!-- Charles must come style here properly-->
            <div class="pb-3">
              <div class="col-sm-12">
                  <button mat-stroked-button (click)="back()">
                    <mat-icon>arrow_back</mat-icon>View Subscription
                  </button>
              </div>
          </div>
</div>
