<!-- timesheets card -->
<mat-card class="mt-3">
    <!-- content -->
    <mat-card-content>
        <!-- top navigation and acions -->
        <div class="row">
            <div class="col-sm-12 col-md-6">
                <!-- prev date button -->
                <button matTooltip="Previous date" mat-icon-button (click)="onPrevDate()" color="white">
                    <mat-icon>keyboard_arrow_left</mat-icon>
                </button>
                <!-- date time picker -->
                <mat-form-field>
                    <input [(ngModel)]="date" matInput [matDatepicker]="picker" (ngModelChange)="datePickerChanged()">
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
                <!-- next date button -->
                <button matTooltip="Next date" mat-icon-button (click)="onNextDate()" color="white">
                    <mat-icon>keyboard_arrow_right</mat-icon>
                </button>
            </div>
            <div class="col-sm-12 col-md-6 text-right">
                <!-- new timesheet entry -->
                <button (click)="toggleAddView()" mat-button>
                    <mat-icon>add</mat-icon>New Time Entry
                </button>
            </div>
        </div>
    </mat-card-content>
</mat-card>

<div class="alert alert-danger mt-3 text-center" *ngIf="error && !loading">
    Report could not be retrieved. Please try again.
</div>

<!-- loading -->
<mat-card *ngIf="loading" class="w-100">
    <mat-card-content>
        <p class="text-center">Please Wait: Loading Report</p>
    </mat-card-content>
</mat-card>
<mat-card *ngIf="addNewTimeEntry">
    <app-timesheet-editor (date)="date" (complete)="timesheetEditComplete($event)"></app-timesheet-editor>
</mat-card>

<mat-card  *ngIf="!loading">
    <mat-card-content>        
        <table class="table col-12">
            <thead>
                <tr>
                    <th>Client</th>
                    <th *ngIf="!isMobile">Project</th>
                    <th *ngIf="!isMobile">Activity</th>
                    <th class="text-right">Duration</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <ng-template *ngFor="let contract of contracts">
                    <ng-template *ngFor="let timesheet of contract?.timesheets">
                        <tr *ngIf="!isEditingTimesheet(timesheet)">
                            <td><h5 class="mb-0">{{contract.company.name}}</h5>{{timesheet.description}}</td>
                            <td *ngIf="!isMobile"> - </td>
                            <td *ngIf="!isMobile">{{timesheet.activity}}</td>
                            <td class="text-right"><h5 class="mb-0">{{timesheet.minutes | hoursMinutes}}</h5>{{timesheet.status}}</td>
                            <td class="text-right">
                                <button *ngIf="timesheet.status != 'BILLED' && timesheet.status != 'APPROVED'" (click)="onEditEntry(timesheet)" mat-icon-button><mat-icon>edit</mat-icon></button>
                            </td>
                        </tr>
                        <tr *ngIf="isEditingTimesheet(timesheet)">
                            <td colspan="4"><app-timesheet-editor (date)="date" (complete)="timesheetEditComplete($event)" [timesheet]="timesheet" [contract]="contract.id"></app-timesheet-editor></td>
                            <td>
                                <button (click)="onEditEntry(timesheet)" mat-icon-button><mat-icon>close</mat-icon></button><br>
                                <button (click)="onDeleteEntry(timesheet)" mat-icon-button><mat-icon>delete</mat-icon></button>
                            </td>
                        </tr>
                    </ng-template>
                </ng-template>  
                <tr>
                    <th><h5>Total Hours</h5></th>
                    <th *ngIf="!isMobile"></th>
                    <th *ngIf="!isMobile"></th>
                    <th class="text-right"><h5>{{total | hoursMinutes}}</h5></th>
                    <th></th>
                </tr> 
            </tbody>
        </table>
    </mat-card-content>
</mat-card>
