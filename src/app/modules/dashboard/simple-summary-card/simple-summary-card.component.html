<mat-card class="simple-summary-card">
    <mat-card-header>
        <mat-card-title class="title">{{title}} </mat-card-title>
        <button *ngIf="hasInfo" mat-button (click)="toggleInfo()" class="text-right info-button"><mat-icon>help</mat-icon></button>
    </mat-card-header>
    <mat-card-content class="mat-card-content">
        <h1 class="giant-number">{{visibleTotal}}</h1>
        <button *ngIf="hasRoute" mat-button routerLink="{{route}}"class="text-right enter-button"><mat-icon>arrow_forward</mat-icon></button>
    </mat-card-content>
    <div class="info-card p-3 pr-5" [class.open]="infoVisible">
         <p><small>{{info}}</small></p>
        <button mat-button (click)="toggleInfo()" class="text-right info-card-close-button"><mat-icon>close</mat-icon></button>
    </div>
</mat-card>
