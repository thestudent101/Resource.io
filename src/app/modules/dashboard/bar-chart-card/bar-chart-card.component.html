<mat-card class="bar-chart-card">
    <mat-card-header>
        <mat-card-title class="title">{{title}}</mat-card-title>
        <button *ngIf="hasInfo" mat-button (click)="toggleInfo()" class="text-right info-button"><mat-icon>help</mat-icon></button>
    </mat-card-header>
    <mat-card-content>
        <!--
        <div class="chart-wrapper" *ngIf="chartVisible">
            <canvas baseChart 
            [datasets]="barChartData"
            [labels]="barChartLabel"
            [options]="barChartOptions"
            [plugins]="barChartPlugins"
            [legend]="barChartLegend"
            [colors]="barChartColors"
            [chartType]="barChartType">
            </canvas>
        </div>-->
        <div class="col-12">
            <div class="row">
                <div *ngFor="let topSkill of topSkills " class="col-md-4 " >
                    <div  class="_card col-12 bg-white mb-2 pt-2 pb-2">
                        <div class="row">
                            <div class="col-4">
                                <img src="../../../../assets/images/{{topSkill.logo}}" style="width:100%">
                            </div>
                            <div class="col-8">
                                <h4 class="mb-0"><b>{{topSkill.skillValue}}</b></h4> 
                                <p class="text-muted mt-0"><small>{{topSkill.name}}</small> </p> 
                            </div>
    
                        </div>
                        
    
                    </div>
                </div>
    
            </div>
        </div>
    </mat-card-content>
    <div class="info-card p-3 pr-5" [class.open]="infoVisible">
         <p><small>{{info}}</small></p>
        <button mat-button (click)="toggleInfo()" class="text-right info-card-close-button"><mat-icon>close</mat-icon></button>
    </div>


</mat-card>
