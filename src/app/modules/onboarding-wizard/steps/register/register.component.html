<div class="MainScree mb-2">
    <mat-progress-bar *ngIf="loading" class='onboarding-loading-bar'  mode="indeterminate"></mat-progress-bar>

    <div class="register-container">

        <div class="left-side">
            <p class="text-wrap text-center side-p"><i class="fa-solid fa-quote-left m-1"></i>Find the perfect match for your project. BLUE connects you with experienced consultants.<i class="fa-solid fa-quote-right m-1"></i></p>
        </div>

        <div class="right-side">
            <div class="p-3 text-dark d-flex top">
                <button mat-button routerLink="/landing" class="mr-2"><mat-icon class="text-muted">arrow_back</mat-icon>Back</button>
                <h6 class="text-muted small close">STEP 01/02</h6>
            </div>

            <form class="card-body p-3 login-form">
                <div class="row">
                    <div class="col-sm-12">
                        <div class="error-alert" [class.active]="hasErrors">{{errorMessage}}</div>
                    </div>
                </div>
                <div class="row">
                    <!-- Email -->
                    <mat-form-field class="col-sm-12 customForm" appearance="fill">
                        <mat-label>Email</mat-label>
                        <input required pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,4}$" [formControl]="email" matInput placeholder="mail@example.com" type="email" (blur)="emailAddressOnBlur()">
                        <mat-error *ngIf="email.invalid">Email is required</mat-error>
                    </mat-form-field>
                    <!-- Cellphone Number -->
                    <mat-form-field class="col-sm-12 text-dark" appearance="fill">
                        <mat-label>Cellphone Number</mat-label>
                        <input required pattern="^\d{10}$" [formControl]="cellnumber" matInput placeholder="0310011234" type="string">
                        <mat-error *ngIf="cellnumber.invalid">Cellphone number is required</mat-error>
                    </mat-form-field>
                    <!-- Password -->
                    <mat-form-field class="col-sm-12 text-dark" appearance="fill">
                        <mat-label>Password</mat-label>
                        <input required pattern="((?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,})" [formControl]="password" matInput placeholder="******" [type]="newPasswordType">
                        <mat-icon matSuffix (click)="toggleVisibility()" class="password-visibility-toggle-button" *ngIf="!newPasswordVisible">visibility_off</mat-icon>
                        <mat-icon matSuffix (click)="toggleVisibility()" class="password-visibility-toggle-button" *ngIf="newPasswordVisible">visibility</mat-icon>
                        <mat-error *ngIf="password.invalid">Password is required</mat-error>
                    </mat-form-field>
                    <!-- Confirm Password -->
                    <mat-form-field class="col-sm-12 text-dark" appearance="fill">
                        <mat-label>Confirm Password</mat-label>
                        <input required pattern="((?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,})" [formControl]="repeatPassword" matInput placeholder="******" [type]="confirmPasswordType">
                        <mat-error *ngIf="repeatPassword.invalid">Passwords must match</mat-error>
                    </mat-form-field>
                </div>

                <div class="row">
                    <div class="text-center col-sm-12 align-items-center">
                        <button (click)="register()" mat-button [disabled]="loading" matTooltip="Next" class=" customButon"> Continue</button>
                    </div>
                </div>
            </form>

        </div>
    </div>
</div>
